<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expositores - Natal Hair 2026</title>
    
    <!-- CSS Principal e da Página -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="expositores.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <site-sidebar></site-sidebar>

    <!-- Header Fixo da Página Interior -->
    <header class="inner-header">
        <a href="../index.html">
            <img src="../logo.png" alt="Natal Hair" class="inner-logo">
        </a>
        <button id="open-menu" class="hamburger-btn" aria-label="Abrir Menu">
            <div class="hamburger-circle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>
    </header>

    <!-- Seção Principal de Expositores -->
    <main class="expositores-container">
        
        <!-- Cabeçalho do Conteúdo -->
        <div class="expositores-title-area">
            <h1 class="page-title">Nossos Expositores</h1>
            <p class="page-subtitle">
                Conheça as grandes marcas que estarão presentes no Natal Hair 2026. Clique em uma marca para visitar o site oficial.
            </p>
        </div>

        <!-- Container do Grid Dinâmico (Renderizado via JS) -->
        <div id="expositores-grid" class="expositores-grid">
            <!-- Os cards serão inseridos aqui -->
        </div>

    </main>

    <!-- Rodapé -->
    <site-footer></site-footer>

    <!-- Scripts -->
    <script src="../script.js"></script>
    <script src="expositores.js"></script>
    <script src="componentes/sidebar.js"></script>
    <script src="componentes/footer.js"></script>
</body>
</html>
