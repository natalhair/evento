<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação - Natal Hair 2026</title>
    
    <!-- CSS Principal e Específico -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="programacao.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Biblioteca jsPDF para gerar o PDF dinamicamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<site-sidebar></site-sidebar>

    <!-- Header Fixo da Página Interior -->
    <header class="inner-header">
        <a href="../index.html">
            <img src="../logo.png" alt="Natal Hair" class="inner-logo">
        </a>
        <button id="open-menu" class="hamburger-btn" aria-label="Abrir Menu">
            <div class="hamburger-circle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>
    </header>

    <!-- Seção Principal de Programação -->
    <main class="programacao-container">
        
        <div class="programacao-title-area">
            <h1 class="page-title">Programação Oficial</h1>
            <p class="page-subtitle">
                Confira todas as atrações, palestras e shows do Natal Hair 2026.
            </p>
            
            <!-- Botão para Baixar a Programação em PDF -->
            <button id="btn-download-pdf" class="btn-download-pdf">
                <i class="fa-solid fa-file-pdf"></i> Baixar Programação em PDF
            </button>
        </div>

        <!-- Conteúdo Dinâmico injetado via JS a partir do .txt -->
        <div id="programacao-content" class="programacao-content">
            <p class="loading-text">Carregando programação...</p>
        </div>

    </main>

    <!-- Rodapé -->
    <site-footer></site-footer>

    <!-- Scripts -->
    <script src="../script.js"></script>
    <script src="programacao.js"></script>
    <script src="componentes/sidebar.js"></script>
    <script src="componentes/footer.js"></script>
</body>
</html>
