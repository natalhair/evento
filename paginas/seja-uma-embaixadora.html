<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seja uma Embaixadora - Natal Hair 2026</title>
    
    <!-- CSS Principal e Específico -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="sejaebx.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Componente de Sidebar e WhatsApp -->
    <site-sidebar></site-sidebar>

    <!-- Componente de Header Fixo -->
    <site-header></site-header>

    <!-- Conteúdo Principal / Formulário -->
    <main class="form-page-container">
        <div class="form-card">
            <h1 class="page-title">Seja uma Embaixadora</h1>
            <p class="page-subtitle">
                Se você é nossa embaixadora, preencha aqui com os seus dados. Se você ainda não é a nossa embaixadora, aguarde o contato para se tornar uma!
            </p>

            <form id="embaixadora-form" class="styled-form">
                <div class="form-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" required placeholder="Sua cidade">
                    </div>
                    <div class="form-group">
                        <label for="uf">UF *</label>
                        <input type="text" id="uf" name="uf" maxlength="2" required placeholder="RN">
                    </div>
                </div>

                <div class="form-group">
                    <label for="cpf_cnpj">CPF / CNPJ *</label>
                    <input type="text" id="cpf_cnpj" name="cpf_cnpj" required placeholder="000.000.000-00 ou CNPJ">
                </div>

                <div class="form-group">
                    <label for="whatsapp">WhatsApp *</label>
                    <input type="text" id="whatsapp" name="whatsapp" required placeholder="84 9 9999-9999">
                </div>

                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="text" id="email" name="email" required placeholder="fulaninha@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="instagram">Instagram *</label>
                    <input type="text" id="instagram" name="instagram" required placeholder="fulaninha.silva">
                </div>

                <div class="form-group">
                    <label for="historia">Conte-nos sua história *</label>
                    <textarea id="historia" name="historia" rows="5" required placeholder="Conte um pouco sobre sua trajetória..."></textarea>
                </div>

                <div class="form-group">
                    <label for="input-img">Envie uma imagem de perfil *</label>
                    <input type="file" id="input-img" accept="image/*" required>
                    <input type="hidden" id="img-url" name="img">
                    
                    <div id="preview-container" class="preview-container" style="display: none;">
                        <img id="img-preview" src="" alt="Pré-visualização da imagem">
                        <span id="upload-status">Imagem carregada com sucesso!</span>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn-submit">Enviar Cadastro</button>
                <div id="form-mensagem" class="form-mensagem"></div>
            </form>
        </div>
    </main>

    <!-- Componente de Rodapé -->
    <site-footer></site-footer>

    <!-- Scripts dos Componentes e Lógica -->
    <script src="componentes/sidebar.js"></script>
    <script src="componentes/header.js"></script>
    <script src="componentes/footer.js"></script>
    <script src="sejaebx.js"></script>
</body>
</html>
